# about_title: About Me
about_profile_image: images/profile.jpg
about_content: | 
  Hi, I’m **Sergio Verga** – a Data Science Master's student (and external research collaborator) with a background in **Physics (Microelectronics)**.  
  I’m currently working on my thesis in **Reinforcement Learning for Robotics** at the **University of Milano-Bicocca** and doing research at the [**Intelligent Sensing Lab (ISLab)**](https://islab.disco.unimib.it/).

  My main interests include **Reinforcement Learning (for Robotics)**, **Deep Learning**, and **Natural Language Processing**. I’m passionate about bridging cutting-edge AI with real-world applications in automation, robotics, and intelligent systems.

  **Tech stack:** Python · PyTorch · TensorFlow · Hugging Face · Jupyter · KNIME · Git

